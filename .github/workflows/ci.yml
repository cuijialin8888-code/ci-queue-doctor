name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run linter
        run: python -m ruff check src tests

      - name: Compile sources
        run: python -m compileall -q src tests

      - name: Check CLI contract
        run: ci-queue-doctor --help

  package-smoke:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple build

      - name: Build wheel and source distribution
        run: python -m build --outdir dist

      - name: Install wheel in a clean environment
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl

      - name: Exercise installed package
        run: .package-smoke/bin/ci-queue-doctor --version
